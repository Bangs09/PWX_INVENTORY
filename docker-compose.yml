services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pwx-inventory-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://pwxnetteam.dpdns.org
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
    networks:
      - pwx-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode < 200 || r.statusCode >= 400) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: pwx-inventory-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - pwx-net
    environment:
      ACME_AGREE: "true"
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pwx-net:
    driver: bridge

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
